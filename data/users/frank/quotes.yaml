quotes:
  - text: "It's dangerous to go alone! Take this."
    attribution: "Old Man, The Legend of Zelda"
  - text: "The right man in the wrong place can make all the difference in the world."
    attribution: "G-Man, Half-Life 2"
  - text: "War. War never changes."
    attribution: "Narrator, Fallout"
  - text: "What is a man? A miserable little pile of secrets!"
    attribution: "Dracula, Castlevania: Symphony of the Night"
  - text: "A hero need not speak. When he is gone, the world will speak for him."
    attribution: "Halo 3"
