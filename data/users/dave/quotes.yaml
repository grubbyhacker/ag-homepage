quotes:
  - text: >
      A good photograph is one that communicates a fact, touches
      the heart and leaves the viewer a changed person for having seen it.
    attribution: "Irving Penn"
  - text: "You don't take a photograph, you make it."
    attribution: "Ansel Adams"
  - text: "To travel is to discover that everyone is wrong about other countries."
    attribution: "Aldous Huxley"
  - text: "The camera is an instrument that teaches people how to see without a camera."
    attribution: "Dorothea Lange"
  - text: "Wherever you go, go with all your heart."
    attribution: "Confucius"
