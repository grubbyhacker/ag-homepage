{# djlint:off #}
{{ define "main" }}
  <div class="landing-hero">
    {{ .Content }}
  </div>
  <div class="user-grid">
    {{ range $username, $u := site.Data.users }}
      {{ if $u.profile.enabled }}
        {{ partial "user-card.html" $u }}
      {{ end }}
    {{ end }}
  </div>
{{ end }}
{# djlint:on #}
