<article class="blog-card">
  <header>
    <div class="post-meta">
      {{ if .Date }}
      <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format (site.Params.dateFormat | default "02 Jan 2006") }}</time>
      {{ end }}
      {{ if .ReadingTime }}
      <span class="read-time">{{ .ReadingTime }} min read</span>
      {{ end }}
    </div>
    <h2 class="post-title">
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </h2>
  </header>
  {{ with .Params.tags }}
  <div class="post-tags">
    {{ range . }}
      {{ partial "tag-pill.html" . }}
    {{ end }}
  </div>
  {{ end }}
  <p class="post-summary">
{{ .Summary | plainify | truncate 150 }}
  </p>
</article>
