<div class="highlight-file"
     style="margin: 1.5rem 0;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            overflow: hidden">
  <div class="highlight-file__header"
       style="background-color: var(--color-bg-raised);
              padding: 0.5rem 1rem;
              border-bottom: 1px solid var(--color-border);
              font-family: monospace;
              font-size: 0.85rem;
              color: var(--color-text-muted)">
    {{ .Get "name" }}
  </div>
  <div class="highlight-file__body">
    {{ highlight .Inner (.Get "lang") "" }}
  </div>
</div>
