{{ define "main" }}
<div class="page-header" style="margin-bottom: 2rem;">
  <h1>
Posts Tagged: “{{ .Title }}”
  </h1>
    {{ with .Content }}
  <div class="page-intro">
{{ . }}
  </div>
    {{ end }}
</div>

<div class="list-layout">
    {{ $paginator := .Paginate .Pages }}
    {{ range $paginator.Pages }}
      {{ partial "blog-card.html" . }}
    {{ end }}
    {{ template "_internal/pagination.html" . }}
</div>
{{ end }}
